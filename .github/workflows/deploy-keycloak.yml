name: Deploy Keycloak to EKS

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (example: b8ea836 or latest)"
        required: true
        default: "latest"

  push:
    branches:
      - main
    paths:
      - "deploy/**"
      - ".github/workflows/deploy-keycloak.yml"

permissions:
  contents: read

concurrency:
  group: keycloak-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: keycloak
  IMAGE_NAME: ghcr.io/${{ github.repository }}/keycloak
  KUBECTL_VERSION: v1.35.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve image tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.image_tag }}" ]; then
            echo "image_tag=${{ github.event.inputs.image_tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "${K8S_NAMESPACE}" >/dev/null 2>&1 || \
          kubectl create namespace "${K8S_NAMESPACE}"

      - name: Create or update Keycloak config secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret generic keycloak-secret \
            --from-literal=KC_DB_URL='${{ secrets.KC_DB_URL }}' \
            --from-literal=KC_DB_USERNAME='${{ secrets.KC_DB_USERNAME }}' \
            --from-literal=KC_DB_PASSWORD='${{ secrets.KC_DB_PASSWORD }}' \
            --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME='${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}' \
            --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD='${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update GHCR pull secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username='${{ github.repository_owner }}' \
            --docker-password='${{ secrets.GHCR_PAT }}' \
            --docker-email='none@local' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Keycloak
        run: |
          FULL_IMAGE="${IMAGE_NAME}:${{ steps.vars.outputs.image_tag }}"
          echo "Deploying image: ${FULL_IMAGE}"

          sed "s|__KEYCLOAK_IMAGE__|${FULL_IMAGE}|g" deploy/deployment.yaml | \
            kubectl -n "${K8S_NAMESPACE}" apply -f -

          kubectl -n "${K8S_NAMESPACE}" apply -f deploy/service.yaml
          kubectl -n "${K8S_NAMESPACE}" apply -f deploy/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/keycloak --timeout=900s

      - name: Show resources
        run: |
          kubectl -n "${K8S_NAMESPACE}" get deploy,po,svc,ing -o wide
