name: Build Keycloak From Source and Deploy to EKS

on:
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - deploy/**
      - .github/workflows/keycloak-deploy.yml

  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: keycloak-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: keycloak
  IMAGE_NAME: ghcr.io/${{ github.repository }}/keycloak
  KUBECTL_VERSION: v1.30.0

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
          --region $AWS_REGION \
          --name $EKS_CLUSTER_NAME

      - name: Ensure namespace exists
        run: |
          kubectl get ns $K8S_NAMESPACE || \
          kubectl create ns $K8S_NAMESPACE

      - name: Create GHCR pull secret
        run: |
          kubectl -n $K8S_NAMESPACE create secret docker-registry ghcr-secret \
          --docker-server=ghcr.io \
          --docker-username=${{ github.repository_owner }} \
          --docker-password=${{ secrets.GHCR_PAT }} \
          --docker-email=none@local \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: Create Keycloak config secret
        run: |
          kubectl -n $K8S_NAMESPACE create secret generic keycloak-secret \
          --from-literal=KC_DB_URL='${{ secrets.KC_DB_URL }}' \
          --from-literal=KC_DB_USERNAME='${{ secrets.KC_DB_USERNAME }}' \
          --from-literal=KC_DB_PASSWORD='${{ secrets.KC_DB_PASSWORD }}' \
          --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME='${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}' \
          --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD='${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}' \
          --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Keycloak
        run: |
          IMAGE="${IMAGE_NAME}:${{ steps.vars.outputs.sha_short }}"
          echo "Deploy image: $IMAGE"

          sed "s|__KEYCLOAK_IMAGE__|$IMAGE|g" deploy/deployment.yaml \
          | kubectl -n $K8S_NAMESPACE apply -f -

          kubectl -n $K8S_NAMESPACE apply -f deploy/service.yaml
          kubectl -n $K8S_NAMESPACE apply -f deploy/ingress.yaml

      - name: Wait rollout
        run: |
          kubectl rollout status deployment/keycloak \
          -n $K8S_NAMESPACE \
          --timeout=600s

      - name: Show resources
        run: |
          kubectl -n $K8S_NAMESPACE get deploy,po,svc,ing -o wide
