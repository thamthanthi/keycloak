name: Build Keycloak Image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".github/workflows/build-keycloak-from-source.yml"
      - "pom.xml"
      - ".mvn/**"
      - "mvnw"
      - "quarkus/**"
      - "js/**"
      - "common/**"
      - "core/**"
      - "server-spi/**"
      - "server-spi-private/**"
      - "services/**"
      - "model/**"
      - "themes/**"
      - "theme/**"
      - "distribution/**"
      - "authz/**"
      - "federation/**"
      - "integration/**"
      - "crypto/**"
      - "dependencies/**"
      - "boms/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: keycloak-build-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}/keycloak

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.vars.outputs.sha_short }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set short SHA
        id: vars
        run: echo "sha_short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.sha_short }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save image tag artifact
        run: |
          echo "${{ steps.vars.outputs.sha_short }}" > image-tag.txt

      - name: Upload image tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: keycloak-image-tag
          path: image-tag.txt
