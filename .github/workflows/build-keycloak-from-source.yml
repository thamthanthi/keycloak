name: Build Keycloak From Source and Deploy to EKS

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - "deploy/**"
      - ".github/workflows/build-keycloak-from-source.yml"

permissions:
  contents: read
  packages: write

concurrency:
  group: keycloak-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  EKS_CLUSTER_NAME: ${{ secrets.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: keycloak
  IMAGE_NAME: ghcr.io/${{ github.repository }}/keycloak
  KUBECTL_VERSION: v1.35.0

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify tools
        run: |
          java -version
          git --version
          chmod +x mvnw

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_NAME }}:sha-${{ steps.vars.outputs.short_sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: ${{ env.KUBECTL_VERSION }}

      - name: Update kubeconfig for EKS
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"

      - name: Ensure namespace exists
        run: |
          kubectl get namespace "${K8S_NAMESPACE}" >/dev/null 2>&1 || \
          kubectl create namespace "${K8S_NAMESPACE}"

      - name: Create or update Keycloak secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret generic keycloak-secret \
            --from-literal=KC_DB_URL='${{ secrets.KC_DB_URL }}' \
            --from-literal=KC_DB_USERNAME='${{ secrets.KC_DB_USERNAME }}' \
            --from-literal=KC_DB_PASSWORD='${{ secrets.KC_DB_PASSWORD }}' \
            --from-literal=KC_BOOTSTRAP_ADMIN_USERNAME='${{ secrets.KC_BOOTSTRAP_ADMIN_USERNAME }}' \
            --from-literal=KC_BOOTSTRAP_ADMIN_PASSWORD='${{ secrets.KC_BOOTSTRAP_ADMIN_PASSWORD }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update GHCR pull secret
        run: |
          kubectl -n "${K8S_NAMESPACE}" create secret docker-registry ghcr-secret \
            --docker-server=ghcr.io \
            --docker-username='${{ github.repository_owner }}' \
            --docker-password='${{ secrets.GHCR_PAT }}' \
            --docker-email='none@local' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy Keycloak
        run: |
          FULL_IMAGE="${IMAGE_NAME}:sha-${{ steps.vars.outputs.short_sha }}"
          echo "Deploying image: ${FULL_IMAGE}"

          sed "s|__KEYCLOAK_IMAGE__|${FULL_IMAGE}|g" deploy/deployment.yaml | \
            kubectl -n "${K8S_NAMESPACE}" apply -f -

          kubectl -n "${K8S_NAMESPACE}" apply -f deploy/service.yaml
          kubectl -n "${K8S_NAMESPACE}" apply -f deploy/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl -n "${K8S_NAMESPACE}" rollout status deployment/keycloak --timeout=900s

      - name: Show deployed resources
        run: |
          kubectl -n "${K8S_NAMESPACE}" get deploy,po,svc,ing -o wide
